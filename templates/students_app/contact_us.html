{% extends "students_app/base.html" %}{% block title %}Contact Us{% endblock %}{% block content %}<section class="page-heading"><p class="eyebrow">WE'RE HERE TO HELP</p><h1>Contact Us</h1><p>Fill in the form and tell us how we can help.</p></section><form class="contact-form card" method="post">{% csrf_token %}<div class="form-grid"><label>Name<input type="text" name="name" autocomplete="name" required></label><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Subject<input type="text" name="subject" required></label><label>Mobile<input type="tel" name="mobile" autocomplete="tel" required></label><label class="full-width">Query<textarea name="query" rows="5" required></textarea></label></div><button class="button" type="submit">Send query</button></form>{% endblock %}
