{% load static %}
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Student Corner{% endblock %} | Student Corner</title><link rel="stylesheet" href="{% static 'students_app/styles.css' %}"></head><body>
<header class="site-header"><a class="brand" href="{% url 'students_app:home' %}">Student Corner</a><nav aria-label="Main navigation"><a href="{% url 'students_app:home' %}">Home</a><a href="{% url 'students_app:about_us' %}">About Us</a><a href="{% url 'students_app:content' %}">Content</a><a href="{% url 'students_app:contact_us' %}">Contact Us</a><a href="{% url 'students_app:faq' %}">FAQ</a></nav></header>
<main class="container">{% if messages %}{% for message in messages %}<div class="notice {{ message.tags }}" role="status">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main><footer><p>Student Corner · Learn, ask, and grow.</p></footer></body></html>
